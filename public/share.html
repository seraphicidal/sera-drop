<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shared File — sera.drop</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="container">
    <header class="navbar">
      <a href="/" class="brand">
        <div class="brand-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="17 8 12 3 7 8"/>
            <line x1="12" y1="3" x2="12" y2="15"/>
          </svg>
        </div>
        <span>sera.drop</span>
      </a>
      <a href="/" class="btn btn-secondary">Upload New File</a>
    </header>

    <main id="mainContent">
      <div class="card" style="text-align: center; padding: 64px 24px; color: var(--text-secondary);">
        Loading shared file...
      </div>
    </main>
  </div>

  
  <div id="lightboxOverlay" class="lightbox-overlay" aria-hidden="true">
    <div class="lightbox-topbar">
      <div class="lightbox-title">
        <span id="lbFileName">image.png</span>
        <span id="lbResolution" class="image-res-badge"></span>
      </div>
      <div class="lightbox-controls">
        <button type="button" id="lbZoomOut" class="btn btn-secondary btn-sm" title="Zoom Out (-)">−</button>
        <span id="lbZoomLevel" class="zoom-indicator">100%</span>
        <button type="button" id="lbZoomIn" class="btn btn-secondary btn-sm" title="Zoom In (+)">+</button>
        <button type="button" id="lbFitBtn" class="btn btn-secondary btn-sm" title="Fit to Screen">Fit</button>
        <button type="button" id="lbOriginalBtn" class="btn btn-primary btn-sm" title="Show 1:1 Original Resolution (100%)">1:1 Original</button>
        <a id="lbRawLink" href="#" target="_blank" class="btn btn-secondary btn-sm" title="Open raw uncompressed image in new tab">Raw Image</a>
        <button type="button" id="lbCloseBtn" class="btn btn-danger btn-sm" title="Exit Fullscreen (Esc)">Close ✕</button>
      </div>
    </div>
    <div id="lightboxStage" class="lightbox-stage">
      <img id="lightboxImg" class="zoomable-img" src="" alt="" />
      <div class="lightbox-hint">Scroll to zoom • Drag to pan • Double-click for 1:1 original resolution • Esc to exit</div>
    </div>
  </div>

  <div id="toast" class="toast">Copied to clipboard!</div>

  <script>
    const mainContent = document.getElementById('mainContent');
    const toast = document.getElementById('toast');

    let toastTimer = null;
    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 2500);
    }

    function formatBytes(bytes) {
      if (bytes === 0) return '0 B';
      const k = 1024;
      const sizes = ['B', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
    }

    function formatDate(iso) {
      const d = new Date(iso);
      return d.toLocaleString(undefined, {
        year: 'numeric',
        month: 'short',
        day: 'numeric',
        hour: '2-digit',
        minute: '2-digit'
      });
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    async function copyText(text) {
      try {
        await navigator.clipboard.writeText(text);
        showToast('Short link copied to clipboard!');
      } catch {
        const input = document.createElement('input');
        input.value = text;
        document.body.appendChild(input);
        input.select();
        document.execCommand('copy');
        document.body.removeChild(input);
        showToast('Short link copied to clipboard!');
      }
    }

    function createPanZoomController({ stage, img, zoomLabel, onDoubleClick }) {
      let scale = 1;
      let panX = 0;
      let panY = 0;
      let isDragging = false;
      let startX = 0;
      let startY = 0;

      function updateTransform() {
        img.style.transform = `translate(calc(-50% + ${panX}px), calc(-50% + ${panY}px)) scale(${scale})`;
        if (zoomLabel) {
          zoomLabel.textContent = `${Math.round(scale * 100)}%`;
        }
      }

      function computeFitScale() {
        const nw = img.naturalWidth || 1;
        const nh = img.naturalHeight || 1;
        img.style.width = `${nw}px`;
        img.style.height = `${nh}px`;
        const sw = stage.clientWidth || 700;
        const sh = stage.clientHeight || 520;
        const pad = 24;
        const scaleX = Math.max(50, sw - pad) / nw;
        const scaleY = Math.max(50, sh - pad) / nh;
        return Math.min(scaleX, scaleY, 1);
      }

      function fitToStage() {
        scale = computeFitScale();
        panX = 0;
        panY = 0;
        updateTransform();
      }

      function setOriginalResolution() {
        if (img.naturalWidth && img.naturalHeight) {
          img.style.width = `${img.naturalWidth}px`;
          img.style.height = `${img.naturalHeight}px`;
        }
        scale = 1;
        panX = 0;
        panY = 0;
        updateTransform();
      }

      function zoomBy(factor, clientX, clientY) {
        const prevScale = scale;
        const nextScale = Math.min(Math.max(scale * factor, 0.05), 12);
        if (clientX !== undefined && clientY !== undefined) {
          const rect = stage.getBoundingClientRect();
          const cx = clientX - (rect.left + rect.width / 2);
          const cy = clientY - (rect.top + rect.height / 2);
          const ratio = nextScale / prevScale;
          panX = cx - (cx - panX) * ratio;
          panY = cy - (cy - panY) * ratio;
        }
        scale = nextScale;
        updateTransform();
      }

      stage.addEventListener('wheel', (e) => {
        e.preventDefault();
        const factor = e.deltaY < 0 ? 1.18 : 1 / 1.18;
        zoomBy(factor, e.clientX, e.clientY);
      }, { passive: false });

      stage.addEventListener('mousedown', (e) => {
        if (e.button !== 0) return;
        isDragging = true;
        startX = e.clientX - panX;
        startY = e.clientY - panY;
        stage.classList.add('dragging');
      });

      window.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        panX = e.clientX - startX;
        panY = e.clientY - startY;
        updateTransform();
      });

      window.addEventListener('mouseup', () => {
        if (isDragging) {
          isDragging = false;
          stage.classList.remove('dragging');
        }
      });

      stage.addEventListener('touchstart', (e) => {
        if (e.touches.length === 1) {
          isDragging = true;
          startX = e.touches[0].clientX - panX;
          startY = e.touches[0].clientY - panY;
        }
      }, { passive: true });

      stage.addEventListener('touchmove', (e) => {
        if (!isDragging || e.touches.length !== 1) return;
        panX = e.touches[0].clientX - startX;
        panY = e.touches[0].clientY - startY;
        updateTransform();
      }, { passive: true });

      stage.addEventListener('touchend', () => {
        isDragging = false;
      });

      stage.addEventListener('dblclick', (e) => {
        if (onDoubleClick) {
          onDoubleClick(e);
          return;
        }
        const fit = computeFitScale();
        if (Math.abs(scale - 1) < 0.05 && fit < 0.98) {
          fitToStage();
        } else {
          const prevScale = scale;
          scale = 1;
          const rect = stage.getBoundingClientRect();
          const cx = e.clientX - (rect.left + rect.width / 2);
          const cy = e.clientY - (rect.top + rect.height / 2);
          const ratio = scale / prevScale;
          panX = cx - (cx - panX) * ratio;
          panY = cy - (cy - panY) * ratio;
          updateTransform();
        }
      });

      return {
        fitToStage,
        setOriginalResolution,
        zoomIn: () => zoomBy(1.25),
        zoomOut: () => zoomBy(1 / 1.25),
        getScale: () => scale
      };
    }

    const lightboxOverlay = document.getElementById('lightboxOverlay');
    const lightboxStage = document.getElementById('lightboxStage');
    const lightboxImg = document.getElementById('lightboxImg');
    const lbFileName = document.getElementById('lbFileName');
    const lbResolution = document.getElementById('lbResolution');
    const lbZoomLevel = document.getElementById('lbZoomLevel');
    const lbZoomIn = document.getElementById('lbZoomIn');
    const lbZoomOut = document.getElementById('lbZoomOut');
    const lbFitBtn = document.getElementById('lbFitBtn');
    const lbOriginalBtn = document.getElementById('lbOriginalBtn');
    const lbRawLink = document.getElementById('lbRawLink');
    const lbCloseBtn = document.getElementById('lbCloseBtn');

    const lbController = createPanZoomController({
      stage: lightboxStage,
      img: lightboxImg,
      zoomLabel: lbZoomLevel
    });

    lbZoomIn.addEventListener('click', () => lbController.zoomIn());
    lbZoomOut.addEventListener('click', () => lbController.zoomOut());
    lbFitBtn.addEventListener('click', () => lbController.fitToStage());
    lbOriginalBtn.addEventListener('click', () => lbController.setOriginalResolution());

    async function openFullscreenViewer(file, startInOriginalResolution = false) {
      lbFileName.textContent = file.originalName;
      lbRawLink.href = file.rawUrl;
      lightboxImg.src = file.rawUrl;
      lightboxOverlay.classList.add('active');
      lightboxOverlay.setAttribute('aria-hidden', 'false');

      if (!document.fullscreenElement && lightboxOverlay.requestFullscreen) {
        try {
          await lightboxOverlay.requestFullscreen();
        } catch {}
      }

      const applyInitialZoom = () => {
        lbResolution.textContent = `${lightboxImg.naturalWidth} × ${lightboxImg.naturalHeight} px`;
        if (startInOriginalResolution) {
          lbController.setOriginalResolution();
        } else {
          lbController.fitToStage();
        }
      };

      if (lightboxImg.complete && lightboxImg.naturalWidth) {
        requestAnimationFrame(applyInitialZoom);
      } else {
        lightboxImg.onload = () => requestAnimationFrame(applyInitialZoom);
      }
    }

    async function closeFullscreenViewer() {
      lightboxOverlay.classList.remove('active');
      lightboxOverlay.setAttribute('aria-hidden', 'true');
      if (document.fullscreenElement && document.exitFullscreen) {
        try {
          await document.exitFullscreen();
        } catch {}
      }
    }

    lbCloseBtn.addEventListener('click', closeFullscreenViewer);

    document.addEventListener('fullscreenchange', () => {
      if (!document.fullscreenElement && lightboxOverlay.classList.contains('active')) {
        lightboxOverlay.classList.remove('active');
        lightboxOverlay.setAttribute('aria-hidden', 'true');
      }
    });

    window.addEventListener('keydown', (e) => {
      if (!lightboxOverlay.classList.contains('active')) return;
      if (e.key === 'Escape') {
        closeFullscreenViewer();
      } else if (e.key === '+' || e.key === '=') {
        lbController.zoomIn();
      } else if (e.key === '-') {
        lbController.zoomOut();
      } else if (e.key === '1') {
        lbController.setOriginalResolution();
      } else if (e.key === '0') {
        lbController.fitToStage();
      }
    });

    async function loadSharedFile() {
      const pathParts = window.location.pathname.split('/').filter(Boolean);
      const code = pathParts[pathParts.length - 1];

      try {
        const res = await fetch(`/api/files/${encodeURIComponent(code)}`);
        if (!res.ok) {
          mainContent.innerHTML = `
            <div class="card" style="text-align: center; padding: 64px 24px;">
              <h2 style="font-size: 1.6rem; margin-bottom: 10px;">File Not Found</h2>
              <p style="color: var(--text-secondary); margin-bottom: 24px;">
                This short link does not exist or the file has been deleted.
              </p>
              <a href="/" class="btn btn-primary btn-lg">Upload a File</a>
            </div>
          `;
          return;
        }

        const file = await res.json();
        document.title = `${file.originalName} — sera.drop`;

        mainContent.innerHTML = `
          <div class="share-grid">
            <div class="card">
              <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap;">
                <div style="min-width: 0; flex: 1;">
                  <span class="nav-badge" style="display: inline-block; margin-bottom: 10px;">${escapeHtml(file.mimeType)}</span>
                  <h1 style="font-size: 1.55rem; word-break: break-all; line-height: 1.3;">${escapeHtml(file.originalName)}</h1>
                  <div class="file-sub" style="margin-top: 8px; font-size: 0.9rem;">
                    <span><strong>Size:</strong> ${formatBytes(file.size)}</span>
                    <span>•</span>
                    <span><strong>Uploaded:</strong> ${formatDate(file.createdAt)}</span>
                    <span>•</span>
                    <span><strong id="downloadCount">${file.downloads}</strong> downloads</span>
                  </div>
                </div>
                <a href="${file.downloadUrl}" id="downloadBtn" class="btn btn-primary btn-lg">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                    <polyline points="7 10 12 15 17 10"/>
                    <line x1="12" y1="15" x2="12" y2="3"/>
                  </svg>
                  Download File
                </a>
              </div>

              <div id="previewContainer" class="preview-box"></div>
            </div>

            <aside class="card" style="display: flex; flex-direction: column; gap: 18px;">
              <div>
                <h3 style="font-size: 1.05rem; margin-bottom: 4px;">Share Short Link</h3>
                <p style="font-size: 0.84rem; color: var(--text-secondary);">Anyone with this link can preview and download this file.</p>
                <div class="short-link-box" style="margin: 12px 0 10px;">
                  <input type="text" id="shortUrlInput" class="short-link-input" value="${escapeHtml(file.shortUrl)}" readonly style="font-size: 0.92rem;" />
                </div>
                <button type="button" id="copyBtn" class="btn btn-primary" style="width: 100%;">
                  Copy Short Link
                </button>
              </div>

              <div style="border-top: 1px solid var(--border-subtle); padding-top: 18px; text-align: center;">
                <h4 style="font-size: 0.92rem; margin-bottom: 12px; color: var(--text-secondary);">QR Code</h4>
                <div class="qr-box" style="display: inline-block;">
                  <img src="${file.qrCodeDataUrl}" alt="QR Code" style="width: 180px; height: 180px;" />
                  <span>Scan with phone camera</span>
                </div>
                <div style="margin-top: 12px;">
                  <a href="${file.qrCodeDataUrl}" download="qr-${escapeHtml(file.code)}.png" class="btn btn-secondary" style="width: 100%;">
                    Save QR Image
                  </a>
                </div>
              </div>
            </aside>
          </div>
        `;

        document.getElementById('copyBtn').addEventListener('click', () => copyText(file.shortUrl));
        document.getElementById('downloadBtn').addEventListener('click', () => {
          const countEl = document.getElementById('downloadCount');
          if (countEl) {
            countEl.textContent = String(parseInt(countEl.textContent || '0', 10) + 1);
          }
        });

        renderPreview(file, document.getElementById('previewContainer'));
      } catch (err) {
        console.error(err);
      }
    }

    async function renderPreview(file, container) {
      const cat = file.previewCategory;
      if (cat === 'image') {
        container.innerHTML = `
          <div class="image-preview-wrapper">
            <div class="image-toolbar">
              <span id="inlineResBadge" class="image-res-badge">Loading resolution...</span>
              <div class="image-toolbar-actions">
                <button type="button" id="inlineZoomOut" class="btn btn-secondary btn-sm" title="Zoom Out">−</button>
                <span id="inlineZoomLabel" class="zoom-indicator">100%</span>
                <button type="button" id="inlineZoomIn" class="btn btn-secondary btn-sm" title="Zoom In">+</button>
                <button type="button" id="inlineFitBtn" class="btn btn-secondary btn-sm">Fit</button>
                <button type="button" id="inlineOrigBtn" class="btn btn-secondary btn-sm" title="View 1:1 Original Pixels">1:1 Original</button>
                <button type="button" id="inlineFullscreenBtn" class="btn btn-primary btn-sm">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="15 3 21 3 21 9"/>
                    <polyline points="9 21 3 21 3 15"/>
                    <line x1="21" y1="3" x2="14" y2="10"/>
                    <line x1="3" y1="21" x2="10" y2="14"/>
                  </svg>
                  Fullscreen (Original Res)
                </button>
              </div>
            </div>
            <div id="inlineStage" class="inline-image-stage">
              <img id="inlineImg" class="zoomable-img" src="${file.rawUrl}" alt="${escapeHtml(file.originalName)}" />
            </div>
          </div>
        `;

        const inlineStage = document.getElementById('inlineStage');
        const inlineImg = document.getElementById('inlineImg');
        const inlineZoomLabel = document.getElementById('inlineZoomLabel');
        const inlineResBadge = document.getElementById('inlineResBadge');

        const inlineController = createPanZoomController({
          stage: inlineStage,
          img: inlineImg,
          zoomLabel: inlineZoomLabel
        });

        const initInlineImage = () => {
          inlineResBadge.textContent = `${inlineImg.naturalWidth} × ${inlineImg.naturalHeight} px (Original)`;
          inlineController.fitToStage();
        };
        if (inlineImg.complete && inlineImg.naturalWidth) {
          initInlineImage();
        } else {
          inlineImg.addEventListener('load', initInlineImage);
        }

        document.getElementById('inlineZoomIn').addEventListener('click', () => inlineController.zoomIn());
        document.getElementById('inlineZoomOut').addEventListener('click', () => inlineController.zoomOut());
        document.getElementById('inlineFitBtn').addEventListener('click', () => inlineController.fitToStage());
        document.getElementById('inlineOrigBtn').addEventListener('click', () => inlineController.setOriginalResolution());
        document.getElementById('inlineFullscreenBtn').addEventListener('click', () => openFullscreenViewer(file, true));
      } else if (cat === 'video') {
        container.innerHTML = `<video controls preload="metadata" src="${file.rawUrl}"></video>`;
      } else if (cat === 'audio') {
        container.innerHTML = `<audio controls preload="metadata" src="${file.rawUrl}"></audio>`;
      } else if (cat === 'pdf') {
        container.innerHTML = `<iframe src="${file.rawUrl}" title="${escapeHtml(file.originalName)}"></iframe>`;
      } else if (cat === 'text' && file.size <= 2 * 1024 * 1024) {
        container.innerHTML = `<div class="preview-text">Loading text preview...</div>`;
        try {
          const res = await fetch(file.rawUrl);
          const text = await res.text();
          const pre = container.querySelector('.preview-text');
          pre.textContent = text.slice(0, 100000);
        } catch {
          container.innerHTML = `<div class="preview-fallback">Preview unavailable. Click Download File above.</div>`;
        }
      } else {
        container.innerHTML = `
          <div class="preview-fallback">
            <div class="dropzone-icon" style="margin-bottom: 12px;">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                <polyline points="14 2 14 8 20 8"/>
              </svg>
            </div>
            <p style="font-weight: 600; color: var(--text-primary); margin-bottom: 4px;">${escapeHtml(file.originalName)}</p>
            <p style="font-size: 0.88rem;">Direct preview is not available for this file type. Use the Download button above.</p>
          </div>
        `;
      }
    }

    loadSharedFile();
  </script>
</body>
</html>
