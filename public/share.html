<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>sera.drop</title>
  <link rel="icon" type="image/svg+xml" href="/icon.svg" />
  <link rel="icon" type="image/webp" href="/icon.webp" />
  <link rel="shortcut icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" href="/icon.webp" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="container">
    <header class="navbar">
      <a href="/" class="brand">
        <img src="/icon.webp" alt="sera.drop" class="brand-icon" />
        <span>sera<span class="brand-dot">.</span>drop</span>
      </a>
      <div class="nav-meta">
        <button type="button" class="btn btn-danger btn-sm" data-open-report="true">Report Abuse</button>
        <a href="/" class="btn btn-secondary btn-sm">Upload</a>
      </div>
    </header>

    <div id="inlineError" class="inline-error-banner" role="alert">
      <span id="inlineErrorText"></span>
      <button type="button" id="inlineErrorDismiss" class="btn btn-secondary btn-sm" aria-label="Dismiss error">Dismiss</button>
    </div>

    <main id="mainContent">
      <div class="card empty-state">Loading</div>
    </main>

    <footer class="legal-footer">
      <span>sera.drop — EU DSA Art. 16 Notice &amp; Action</span>
      <div class="legal-footer-links">
        <a href="/impressum">Impressum</a>
        <a href="/privacy">Privacy Policy</a>
        <button type="button" class="btn btn-danger btn-sm" data-open-report="true">Report Abuse</button>
      </div>
    </footer>
  </div>

  <div id="lightboxOverlay" class="lightbox-overlay" role="dialog" aria-modal="true" aria-label="Image viewer" aria-hidden="true">
    <div class="lightbox-topbar">
      <div class="lightbox-title">
        <span id="lbFileName">image.png</span>
        <span id="lbResolution" class="image-res-badge"></span>
      </div>
      <div class="lightbox-controls">
        <button type="button" id="lbZoomOut" class="btn btn-secondary btn-sm">−</button>
        <span id="lbZoomLevel" class="zoom-indicator">100%</span>
        <button type="button" id="lbZoomIn" class="btn btn-secondary btn-sm">+</button>
        <button type="button" id="lbFitBtn" class="btn btn-secondary btn-sm">Fit</button>
        <button type="button" id="lbOriginalBtn" class="btn btn-primary btn-sm">1:1</button>
        <a id="lbRawLink" href="#" target="_blank" rel="noopener noreferrer" class="btn btn-secondary btn-sm">Raw</a>
        <button type="button" id="lbCloseBtn" class="btn btn-danger btn-sm">Close</button>
      </div>
    </div>
    <div id="lightboxStage" class="lightbox-stage">
      <img id="lightboxImg" class="zoomable-img" src="/icon.svg" alt="" />
    </div>
  </div>

  <div id="reportModal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="reportModalTitle" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-header">
        <h2 id="reportModalTitle">Report Illegal or Abusive Content (DSA Art. 16)</h2>
        <button type="button" id="reportModalClose" class="btn btn-secondary btn-sm" aria-label="Close report dialog">Close</button>
      </div>
      <form id="reportForm" class="modal-form">
        <div class="modal-field">
          <label for="reportTargetUrl">Content URL</label>
          <input type="text" id="reportTargetUrl" class="control-input" required />
        </div>
        <div class="modal-field">
          <label for="reportCategory">Category</label>
          <select id="reportCategory" class="control-select" required>
            <option value="illegal_content">Illegal Content</option>
            <option value="copyright">Copyright Infringement</option>
            <option value="malware">Malware / Phishing</option>
            <option value="csam">CSAM / Severe Harm</option>
            <option value="other">Other Terms Violation</option>
          </select>
        </div>
        <div class="modal-field">
          <label for="reportExplanation">Detailed Explanation</label>
          <textarea id="reportExplanation" class="control-input modal-textarea" required placeholder="Explain why this content is illegal or violates policy..."></textarea>
        </div>
        <div class="modal-field">
          <label for="reportNotifierName">Your Name (optional for anonymous)</label>
          <input type="text" id="reportNotifierName" class="control-input" />
        </div>
        <div class="modal-field">
          <label for="reportNotifierEmail">Your Email (for confirmation)</label>
          <input type="email" id="reportNotifierEmail" class="control-input" />
        </div>
        <label class="checkbox-label">
          <input type="checkbox" id="reportGoodFaith" required checked />
          <span>I confirm in good faith that the information in this notice is accurate and complete.</span>
        </label>
        <div id="reportFormStatus" class="report-status" role="status" aria-live="polite"></div>
        <div class="modal-actions">
          <button type="button" id="reportModalCancel" class="btn btn-secondary btn-sm">Cancel</button>
          <button type="submit" id="reportSubmitBtn" class="btn btn-primary btn-sm">Submit Report</button>
        </div>
      </form>
    </div>
  </div>

  <img src="/offscript.webp" alt="" class="corner-mascot" aria-hidden="true" />
  <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true">Copied</div>

  <script src="/qr.js" defer></script>
  <script src="/app-share.js" defer></script>
</body>
</html>
